# DATABASE (Railway MySQL for Render)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://proxy.railway.app:3306/railway}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:your_railway_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SERVER
server.port=${PORT:5454}

# JPA (MySQL configuration)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# FRONTEND
frontend.url=${FRONTEND_URL:https://sastaabazaar.shop}

# BREVO EMAIL API
brevo.api.key=${BREVO_API_KEY}
brevo.api.url=https://api.brevo.com/v3/smtp/email

# MACHINE LEARNING API
ml.service.url=https://sastabazzarrfinal-production-724e.up.railway.app