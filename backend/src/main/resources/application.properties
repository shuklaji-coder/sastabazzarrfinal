# DATABASE (H2 - fallback for testing)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# SERVER
server.port=${PORT:5454}

# JPA (H2 configuration)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# FRONTEND
frontend.url=${FRONTEND_URL:https://sastaabazaar.shop}

# BREVO EMAIL API
brevo.api.key=${BREVO_API_KEY}
brevo.api.url=https://api.brevo.com/v3/smtp/email

# MACHINE LEARNING API
ml.service.url=https://sastabazzarrfinal-production-724e.up.railway.app