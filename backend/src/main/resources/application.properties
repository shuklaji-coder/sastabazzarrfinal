# DATABASE (Render/PlanetScale)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/default_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# SERVER
server.port=${PORT:5454}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# FRONTEND
frontend.url=${FRONTEND_URL:https://subtle-gumdrop-648ce7.netlify.app}

# BREVO EMAIL API
brevo.api.key=${BREVO_API_KEY}
brevo.api.url=https://api.brevo.com/v3/smtp/email

# MACHINE LEARNING API
ml.service.url=https://sastabazzarrfinal-production-724e.up.railway.app